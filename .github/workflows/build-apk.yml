name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Gradle distribution locally
        shell: bash
        run: |
          set -e
          echo "=== proxy env ==="
          env | grep -iE "proxy" || echo "(no proxy env)"
          echo "=== connectivity check ==="
          curl -sS --max-time 15 -o /dev/null -w "tencent: %{http_code} %{time_connect}s\n" \
            https://mirrors.cloud.tencent.com/gradle/gradle-9.3.1-all.zip || echo "tencent FAIL"
          curl -sS --max-time 15 -o /dev/null -w "services.gradle.org: %{http_code} %{time_connect}s\n" \
            https://services.gradle.org/distributions/gradle-9.3.1-all.zip || echo "services FAIL"
          echo "=== predownload gradle via curl ==="
          curl -sSL --retry 3 --max-time 300 -o "$HOME/gradle-9.3.1-all.zip" \
            https://mirrors.cloud.tencent.com/gradle/gradle-9.3.1-all.zip
          ls -la "$HOME/gradle-9.3.1-all.zip"
          sed -i "s#^distributionUrl=.*#distributionUrl=file\\:///${HOME}/gradle-9.3.1-all.zip#" \
            android/gradle/wrapper/gradle-wrapper.properties
          echo "=== updated wrapper properties ==="
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Setup signing key
        shell: bash
        run: |
          set -e
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          else
            echo "NO signing secrets - generating ephemeral keystore"
            keytool -genkeypair -keystore android/app/release.keystore \
              -alias release -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass androidcfgd7c -keypass androidcfgd7c \
              -dname "CN=opencode-mobile,O=Devopencode,C=CN"
          fi
          mkdir -p android
          echo "storeFile=release.keystore" > android/keystore.properties
          if [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "storePassword=$KEYSTORE_PASSWORD" >> android/keystore.properties
            echo "keyAlias=$KEY_ALIAS" >> android/keystore.properties
            echo "keyPassword=$KEY_PASSWORD" >> android/keystore.properties
          else
            echo "storePassword=androidcfgd7c" >> android/keystore.properties
            echo "keyAlias=release" >> android/keystore.properties
            echo "keyPassword=androidcfgd7c" >> android/keystore.properties
          fi
          ls -la android/app/release.keystore android/keystore.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - run: flutter build apk --release --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
